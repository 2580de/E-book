<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookhub — Search</title><link rel="stylesheet" href="css/style.css"><style>.layout{display:grid;grid-template-columns:220px 1fr;gap:40px;padding:36px 0 64px}.filters{display:flex;flex-direction:column;gap:26px}.filter-group h4{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:12px}.filter-opt{display:flex;gap:9px;font-size:14px;padding:5px 0}.filter-opt input{accent-color:var(--amber)}.result-tabs{display:flex;gap:24px;border-bottom:1px solid var(--ink-line);margin-bottom:12px}.result-tab{padding:10px 0;font-size:14px;color:var(--paper-dim)}.result-tab.active{color:var(--amber)}.result-count{font-family:var(--mono);font-size:11px}.shelf{display:flex;flex-direction:column}.result-row{display:grid;grid-template-columns:56px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--ink-line)}.spine{width:56px;height:78px;border-radius:2px;background:linear-gradient(155deg,var(--ink-card),#242838);border:1px solid var(--ink-line)}.r-title{font-family:var(--serif);font-size:17px;font-weight:600}.r-meta{font-size:13px;color:var(--paper-dim);margin-top:4px}.fmt{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--amber);margin-right:8px}.r-action{font-size:13px;border:1px solid var(--ink-line);padding:8px 14px;border-radius:var(--radius)}.empty-state{padding:30px 0;color:var(--paper-dim)}@media(max-width:820px){.layout{grid-template-columns:1fr}.filters{display:none}.result-row{grid-template-columns:44px 1fr}.spine{width:44px;height:64px}.r-action{grid-column:2;width:max-content}}
</style></head>
<body><nav class="nav"><div class="wrap"><a class="brand" href="index.html"><span class="dot"></span>Bookhub</a><div class="nav-links"><a href="index.html">Home</a><a href="categories.html">Categories</a><a href="search.html" class="active">Search</a><a href="index.html#news">News</a><a href="about.html">About</a></div><a class="nav-cta" href="categories.html">Choose your interests</a></div></nav>
<header class="search-head"><div class="wrap"><p class="hero-eyebrow">Search</p><h1 style="font-family:var(--serif);font-weight:600;font-size:clamp(28px,3.6vw,40px);">Titles, authors, or articles</h1><form id="library-search" class="search-bar lg" action="search.html" method="get"><label class="sr-only" for="q2">Search</label><input id="q2" name="q" type="search" placeholder="Try a title or author…"><button type="submit">Search</button></form></div></header>
<div class="wrap layout"><aside class="filters"><div class="filter-group"><h4>Content type</h4><label class="filter-opt"><input type="checkbox" checked disabled> Books</label><label class="filter-opt"><input type="checkbox" disabled> Audiobooks</label><label class="filter-opt"><input type="checkbox" disabled> Video books</label><label class="filter-opt"><input type="checkbox" disabled> Articles</label></div><div class="filter-group"><h4>Category</h4><p style="font-size:13px;color:var(--paper-dim)">Search currently covers all categories in the books table.</p></div></aside><main><div class="result-tabs"><span class="result-tab active">Books <span id="search-count" class="result-count">0</span></span></div><div id="search-results" class="shelf"><p class="empty-state">Loading…</p></div></main></div>
<footer class="footer"><div class="wrap"><p>Bookhub — books, audiobooks &amp; video books in one shelf.</p><p><a href="help.html">Help</a></p></div></footer><script type="module" src="js/app.js"></script></body></html>
