<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookhub — Profile</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="nav"><div class="wrap"><a class="brand" href="index.html"><span class="dot"></span>Bookhub</a><div class="nav-links"><a href="index.html">Home</a><a href="categories.html">Categories</a><a href="search.html">Search</a><a href="profile.html" class="active">Profile</a></div></div></nav><header class="hero"><div class="wrap"><p class="hero-eyebrow">Your shelf</p><h1>Your Bookhub <em>preferences.</em></h1><p>These browser preferences are stored locally until authentication and profile persistence are connected.</p></div></header><section class="section"><div class="wrap"><div id="profile-preferences" style="max-width:700px"><p>Loading preferences…</p></div></div></section><footer class="footer"><div class="wrap"><p><a href="categories.html">Edit interests</a> · <a href="index.html">Home</a></p></div></footer><script>const p=JSON.parse(localStorage.getItem('bookhubPreferences')||'{}');const root=document.querySelector('#profile-preferences');root.innerHTML=`<h2>Saved interests</h2><p style="margin-top:12px;color:var(--paper-dim)">${(p.categories||[]).length?p.categories.join(', '):'No interests selected yet.'}</p><h2 style="margin-top:32px">Formats</h2><p style="margin-top:12px;color:var(--paper-dim)">${(p.formats||[]).length?p.formats.join(', '):'No formats selected yet.'}</p>`;</script></body></html>
