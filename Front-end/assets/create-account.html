<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12141C">
  <meta name="description" content="Create your Bookhub account.">
  <title>Create account — Bookhub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="brand auth-brand" href="index.html"><span class="dot" aria-hidden="true"></span>Bookhub</a>
    <section class="auth-card" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Start your next chapter</p>
      <h1 id="auth-title">Create your account</h1>
      <p class="auth-intro">Save your interests and build your personal shelf.</p>
      <form id="create-account-form" class="auth-form">
        <label for="full-name">Full name</label>
        <input id="full-name" name="fullName" type="text" autocomplete="name" maxlength="100" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <label class="auth-check"><input id="terms" name="terms" type="checkbox" required> I agree to the account terms and privacy policy.</label>
        <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
        <button class="btn btn-amber auth-submit" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
      <a class="auth-home" href="index.html">← Back to Bookhub</a>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
